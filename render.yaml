services:
  - type: web
    name: atlantic-waves
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DERIV_CLIENT_ID
        sync: false
      - key: DERIV_REDIRECT_URI
        sync: false
